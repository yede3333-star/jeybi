<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="جيبي — إدارة أموالك الشخصية بدون إنترنت" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>جيبي · Jeybi</title>
    <script>
      // Apply cached language/theme/font size before first paint (source of truth is IndexedDB).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('jeybi:ui') || '{}');
          var h = document.documentElement;
          if (p.lang) { h.lang = p.lang; h.dir = p.lang === 'ar' ? 'rtl' : 'ltr'; }
          var dark = p.theme === 'dark' || (p.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) h.classList.add('dark');
          h.dataset.font = p.fontSize || 'md';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
