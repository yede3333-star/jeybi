# On every push to main: run the tests, then
#   - publish the web app to GitHub Pages (as before), and
#   - build the signed Android APK and publish it in GitHub Releases.
# One-time setup: Settings → Pages → Source: "GitHub Actions"; Settings → Secrets → Actions:
# ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (see README, "تطبيق Android").
name: Test, deploy web, build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The user is in Nouakchott (UTC+0); a far-east zone catches day/month boundary bugs.
      - run: npm test
        env:
          TZ: Africa/Nouakchott
      - run: npm test
        env:
          TZ: Pacific/Kiritimati
      - run: node scripts/check-i18n.mjs

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commit count = build number shown in Settings
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: echo "APP_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          # Served from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    concurrency:
      group: android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Version (always increasing, so the APK installs as an update)
        run: |
          CODE=$(git rev-list --count HEAD)
          NAME="$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").$CODE"
          echo "APP_BUILD=$CODE" >> "$GITHUB_ENV"
          echo "JEYBI_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "JEYBI_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Version $NAME (code $CODE)"

      - run: npm ci
      # Relative base (./): the app is loaded from inside the APK.
      - run: npm run build
      - run: npx cap sync android

      - name: Signing key (from the repository secrets, never stored in the repository)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: building an unsigned APK only (no release). See README."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jeybi-release.p12"
          echo "JEYBI_KEYSTORE=$RUNNER_TEMP/jeybi-release.p12" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        env:
          JEYBI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          # On failure, the key lines also go into an annotation (visible without opening the log).
          ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            ERR=$(grep -E "error:|What went wrong|^e: |Could not|FAILED|Exception" -A4 "$RUNNER_TEMP/gradle.log" | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$ERR"
            exit 1
          }

      - name: Check signature
        if: steps.key.outputs.signed == 'true'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk jeybi.apk

      - name: Publish in GitHub Releases
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(git log -1 --pretty=%s)
          gh release create "v$JEYBI_VERSION_NAME" jeybi.apk \
            --title "جيبي $JEYBI_VERSION_NAME" \
            --notes "$(printf 'تطبيق Android موقّع. نزّل jeybi.apk وثبّته فوق النسخة السابقة: بياناتك تبقى كما هي.\n\nالتغيير: %s\n\nالإصدار %s — versionCode %s' "$MSG" "$JEYBI_VERSION_NAME" "$JEYBI_VERSION_CODE")" \
            --target "$GITHUB_SHA" \
            --latest

      # Without the key (secrets not added yet) the build is still checked, and the unsigned APK kept for 7 days.
      - name: Keep the unsigned APK
        if: steps.key.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jeybi-unsigned-${{ env.JEYBI_VERSION_NAME }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
